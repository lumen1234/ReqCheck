version: "3.9"

services:
  reqcheck:
    build: .
    image: rc:v3
    container_name: reqcheck
    ports:
      - "8001:5000"
    volumes:
      # 与 UniPortal 共用 external 卷 uniportal_storage（须先启动 UniPortal 创建该卷）
      # ReqCheck 需读写：导出 JSON 写入 {portal}/{item_id}/document-validator/（与 project_name 同级）
      - uniportal_storage:/data/uniportal
      - reqcheck_local:/app/local_workspaces
      # 本地开发可改为绑定目录（与 Windows 代码目录同步）：
      # - ./local_workspaces:/app/local_workspaces
    environment:
      - UNIPORTAL_STORAGE_PATH=/data/uniportal
      - UNIPORTAL_EXPORT_SUBDIR=document-validator
      - UNIPORTAL_EXPORT_FILENAME=requirement.json
      - LOCAL_WORKSPACES_DIR=/app/local_workspaces
    restart: unless-stopped

volumes:
  uniportal_storage:
    external: true
    name: uniportal_storage
  reqcheck_local:
    name: reqcheck_local
